databaseChangeLog:

  # Baseline for the tables that predate Liquibase adoption (introduced in 3.0).
  # The original database was built by GORM's dbCreate, so changelog-2.5 only
  # covers changes from 2.5 onward and these five tables were never scripted.
  # Every changeset is guarded so an existing database simply marks them as ran.
  #
  # This file must be included FIRST: changelog-2.5's feeling -> app_user foreign
  # key is preconditioned on app_user already existing.

  - changeSet:
      id: 1.0-0-create-app-user
      author: seah
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: app_user
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: admin
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: activated
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: date_created
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: app_user
            columnNames: email
            constraintName: uk_app_user_email

  - changeSet:
      id: 1.0-1-create-kudos
      author: seah
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: kudos
      changes:
        - createTable:
            tableName: kudos
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: sender_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: receiver_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: VARCHAR(200)
              - column:
                  name: date_created
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: kudos
            baseColumnNames: sender_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_kudos_sender
        - addForeignKeyConstraint:
            baseTableName: kudos
            baseColumnNames: receiver_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_kudos_receiver
        - createIndex:
            tableName: kudos
            indexName: idx_kudos_receiver
            columns:
              - column:
                  name: receiver_id
        - createIndex:
            tableName: kudos
            indexName: idx_kudos_date_created
            columns:
              - column:
                  name: date_created

  - changeSet:
      id: 1.0-2-create-kudos-reset
      author: seah
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: kudos_reset
      changes:
        - createTable:
            tableName: kudos_reset
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: reset_by_id
                  type: BIGINT
              - column:
                  name: date_created
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: kudos_reset
            baseColumnNames: reset_by_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_kudos_reset_user

  - changeSet:
      id: 1.0-3-create-login-token
      author: seah
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: login_token
      changes:
        - createTable:
            tableName: login_token
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: expiry_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_created
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: verified
                  type: BOOLEAN
                  constraints:
                    nullable: false
        - createIndex:
            tableName: login_token
            indexName: idx_login_token_token
            columns:
              - column:
                  name: token

  - changeSet:
      id: 1.0-4-create-self-esteem-message
      author: seah
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: self_esteem_message
      changes:
        - createTable:
            tableName: self_esteem_message
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: sort_order
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: self_esteem_message
            columnNames: sort_order
            constraintName: uk_self_esteem_sort_order
