databaseChangeLog:

  - changeSet:
      id: 4.2-0-seed-self-esteem-messages
      author: seah
      preConditions:
        # Only seed an empty table: a database that already has messages keeps
        # them, and re-running never duplicates.
        - onFail: MARK_RAN
        - sqlCheck:
