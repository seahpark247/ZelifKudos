---
grails:
    profile: web
    codegen:
        defaultPackage: kudos
    gorm:
        reactor:
            # Whether to translate GORM events into Reactor events
            # Disabled by default for performance reasons
            events: false
app:
    # Product name shown in page titles, the window chrome, the PWA manifest and
    # outbound email. Falls back to "Kudos" when APP_NAME is unset.
    displayName: ${APP_NAME:Kudos}
    # Only addresses on this domain may request a magic link.
    emailDomain: ${COMPANY_EMAIL_DOMAIN:}
    chat:
        # Minimum gap between two accepted messages from one connection, and how
        # long an identical repeat stays blocked. The client reads both values so
        # it can refuse early instead of dropping text the server would discard.
        cooldownMs: ${CHAT_COOLDOWN_MS:3000}
        duplicateWindowMs: ${CHAT_DUPLICATE_WINDOW_MS:10000}
    schedule:
        # IANA zone for both cron jobs. Michigan is Eastern time; the Upper
        # Peninsula's western counties would be America/Menominee instead.
        timeZone: ${APP_TIMEZONE:America/Detroit}
        # Friday 18:00, and midnight, in the zone above.
        weeklyEmailCron: ${WEEKLY_EMAIL_CRON:0 0 18 ? * FRI}
        nicknameResetCron: ${NICKNAME_RESET_CRON:0 0 0 * * ?}
    # The one account allowed to toggle its own admin flag (bootstrap escape hatch).
    superAdminEmail: ${SUPER_ADMIN_EMAIL:}
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
server:
    # Keep SERVER_URL's port in sync with this, or magic links will point at the
    # wrong port.
    port: ${SERVER_PORT:7777}
    servlet:
        session:
            timeout: 30d
            cookie:
                max-age: 2592000
spring:
    session:
        store-type: jdbc
        jdbc:
            initialize-schema: never
    jmx:
        unique-names: true
    main:
        banner-mode: "off"
    mail:
        host: ${SMTP_HOST:}
        port: ${SMTP_PORT:}
        username: ${SMTP_USERNAME:}
        password: ${SMTP_PASSWORD:}
        properties:
            mail:
                smtp:
                    auth: true
                    # Port 465 speaks TLS from the first byte; 587 negotiates it
                    # with STARTTLS. Flip these together when changing SMTP_PORT,
                    # or the handshake fails.
                    ssl:
                        enable: ${SMTP_SSL:false}
                    starttls:
                        enable: ${SMTP_STARTTLS:true}
                    # Without timeouts a stalled SMTP server pins the request
                    # thread indefinitely — and the magic link is the only way
                    # into the app, so that outage is total.
                    connectiontimeout: 10000
                    timeout: 10000
                    writetimeout: 10000
    liquibase:
        change-log: classpath:db/changelog/changelog-master.yaml
        url: ${DB_URL:jdbc:postgresql://localhost:5432/kudos}
        user: ${DB_USERNAME:}
        password: ${DB_PASSWORD:}
    groovy:
        template:
            check-template-location: false
    devtools:
        restart:
            additional-exclude:
                - '*.gsp'
                - '**/*.gsp'
                - '*.gson'
                - '**/*.gson'
                - 'logback-spring.xml'
                - '*.properties'
environments:
    development:
        management:
            endpoints:
                enabled-by-default: true
                web:
                    base-path: '/actuator'
                    exposure:
                        include: '*'
    production:
        grails:
            serverURL: ${SERVER_URL:http://localhost:7777}
        spring:
            session:
                jdbc:
                    initialize-schema: never
        management:
            endpoints:
                enabled-by-default: false

---
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        defaultScope: singleton
    converters:
        encoding: UTF-8
    views:
        default:
            codec: html
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: html
                scriptlet: html
                taglib: none
                staticparts: none

---
hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
dataSource:
    pooled: true
    jmxExport: true
    driverClassName: org.postgresql.Driver
    dialect: org.hibernate.dialect.PostgreSQLDialect
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

environments:
    development:
        dataSource:
            dbCreate: none
            url: jdbc:postgresql://localhost:5432/kudos
    test:
        dataSource:
            dbCreate: none
            url: jdbc:postgresql://localhost:5432/kudos
    production:
        dataSource:
            dbCreate: none
            url: ${DB_URL:jdbc:postgresql://localhost:5432/kudos}

